<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>PhD Maternal and Neonatal Health – Academic Calendar</title>
<link rel="stylesheet" href="style.css"></head>
<body>
<aside id="side">
  <div class="brand">PhD in Maternal<br>and Neonatal Health<small>Academic Calendar 2026</small></div>
  <div class="sb-scroll"><nav id="nav"></nav></div>
  <div class="foot"><b>Penrose ScholarMW</b><span>Advancing academic excellence</span></div>
</aside>
<main>
  <header id="bar">
    <div class="ttlw"><button id="menu" title="Menu">☰</button><h1 id="ttl"></h1></div>
    <div class="tools">
      <div class="daypick" id="daypick" role="group" aria-label="Weekday">
        <button data-day="all" title="Show the whole week">Week</button>
        <button data-day="0" title="Monday">Mon</button>
        <button data-day="1" title="Tuesday">Tue</button>
        <button data-day="2" title="Wednesday">Wed</button>
        <button data-day="3" title="Thursday">Thu</button>
        <button data-day="4" title="Friday">Fri</button>
      </div>
      <label class="toolsel" title="Default length for new sessions">Duration
        <select id="dur"><option value="30">30 min</option><option value="45">45 min</option><option value="60">60 min</option><option value="90">90 min</option><option value="120">2 h</option></select></label>
      <button id="pw" title="Previous week">◀</button><button id="today" title="Go to current week">Today</button><button id="nw" title="Next week">▶</button><select id="theme" title="Theme"></select><button id="undo" title="Undo">↶</button><button id="redo" title="Redo">↷</button>
      <span id="me" class="me"></span><span id="mode"></span>
      <div class="dl"><button id="dlbtn" title="Download timetable">⭳</button>
        <div id="dlmenu" hidden><a data-x="pdf">Download PDF (full dashboard)</a><a data-x="png">Download PNG (full dashboard)</a><a data-x="docx">Download DOCX</a></div></div>
    </div>
  </header>
  <section id="view"></section>
</main>
<aside id="drawer" hidden></aside>
<script src="app.js"></script>
<script src="comms.js"></script>
</body></html>
